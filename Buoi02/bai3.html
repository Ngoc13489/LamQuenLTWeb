<head>
    <link rel="stylesheet" href="">
    <style type="text/css">
        a{
            text-decoration: none;
            font-size: 15pt;
            font-family: times new roman;
            font-weight: bold;
            padding: 5px;
            border: thin solid white;
            width: 150px;
            
            display: block;
            text-align: center;
        }
        a:link{
            background-color: rgb(190, 15, 167);
            color: white;
        }
        a:visited{
            background-color: rgb(17, 174, 17);
            color: rgb(236, 234, 96);
        }
        a:hover{
            background-color: rgb(61, 109, 230);
            color: black;
        }
        a:active{
            background-color: rgb(190, 33, 33);
            color: rgb(217, 167, 211);
        }

    </style>
</head>
