<head>
    <title>Ví dụ</title>
    <style type="text/css">
        #test{
            background-color:green;
            width:100px;
            height:100px;
            left:0px;
            position: relative;
            animation-name:move_right;
            animation-duration:3s;
            animation-iteration-count:infinite;
        }

        @keyframes move_right {
            0%{left: 0px;}
            100%{left: 600px;}
        }
    </style>
</head>
<body>
    <div id="test"></div>
</body>
