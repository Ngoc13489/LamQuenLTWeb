<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
    </head>
    <body>
        <form action="#" method="post" >
            <table align="center" border="0" cellpadding="0" height="50" bgcolor="#D4E4F7">
                <tr height="40" bgcolor="#0033ff">
                    <th colspan="2">
                        <font face="Times New Roman" size="5" color="white">Thông tin Ứng viên</font>
                    </th>
                </tr>
                <tr>
                    <td width="180">Họ và tên:</td>
                    <td width="180"><input type="text" value=""/></td>
                </tr>
                <tr >
                    <td>Năm sinh:</td>
                    <td><select>
                            <option>1990</option>
                            <option>1991</option>
                            <option>1992</option>
                            <option>1993</option>
                            <option>1994</option>
                            <option>1995</option>
                            <option>1996</option>
                            <option>1997</option>
                            <option>1998</option>
                            <option>1999</option>
                            <option>2000</option>
                            <option>2001</option>
                            <option>2002</option>
                            <option>2003</option>
                            <option>2004</option>
                            <option selected="selected">2005</option>
                        </select>                        
                    </td>    
                </tr>
                <tr>
                    <td>Giới tính:</td>
                    <td>
                        <input type="radio" name="gt" value="Nam" checked="checked"/>Nam

                    </td>
                </tr>
                <tr>
                    <td>Mức lương đề nghị: </td>
                    <td><input type="text" value=""/> VNĐ</td>
                </tr>
                <tr>
                    <td>Hình thức làm việc: </td>
                    <td>
                        <input type="checkbox" name="ht" value="Toàn thời gian"/>Toàn thời gian
                        <input type="checkbox" name="ht" value="Bán thời gian"/>Bán thời gian
                </tr>
                <tr>
                    <td>Thông tin khác: </td>
                    <td><textarea rows="4" cols="30"></textarea></td>
                </tr>
                <tr height="40">
                    <td colspan="2" align="center">
                        <input type="submit" value="Gửi hồ sơ"/>
                        <input type="reset" value="Nhập lại"/>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
